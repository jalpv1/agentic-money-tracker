[project]
name = "agentic-money-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110.0",
    "fio_banka",
    "chromadb",
    "sentence-transformers",
    "langgraph>=1.2.22",
    "langchain-anthropic>=1.7.10",
    "python-dotenv>=1.2.4",
]
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
